# ============================================================
# DD Planner — Cloud Build Pipeline
# Triggered automatically on GitHub push
#
# RULES — DO NOT CHANGE WITHOUT TESTING:
#   - Port MUST be 8080 (Cloud Run requirement)
#   - All required secrets must exist in GCP Secret Manager
#   - --min-instances 1 keeps container warm (prevents cold-start 502)
#   - Only add gcloud flags you have verified exist:
#     VALID: --image --region --platform --port --memory --cpu
#            --min-instances --max-instances --timeout
#            --allow-unauthenticated --set-env-vars --update-secrets
#   INVALID (broke deploy): --startup-probe-initial-delay
#
# PHASE 3 — Dedicated render service (Option B):
#   - A SECOND Cloud Run service "ddplan-render" runs the SAME image but only
#     serves the heavy PDF/PPTX renders, on its OWN independently-scaled
#     capacity, so exports never starve the main app.
#   - The main app (ddplan) delegates renders to it via RENDER_SERVICE_URL +
#     RENDER_SERVICE_KEY (shared secret). If those are unset, the app renders
#     in-process (fully backward compatible).
#   - Substitution vars you must set (see DEPLOYMENT.md):
#       _RENDER_SERVICE_URL : the ddplan-render service URL (fill after first
#                             render-service deploy, then re-run for the main app)
#   - Secret required in Secret Manager: RENDER_SERVICE_KEY (shared secret)
#
# Validate before pushing: bash scripts/validate-deploy.sh
# Full docs: DEPLOYMENT.md
# ============================================================
substitutions:
  _RENDER_SERVICE_URL: ""   # e.g. https://ddplan-render-502760053858.australia-southeast1.run.app

steps:
  # Step 1: Build Docker image (frontend + backend)
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "australia-southeast1-docker.pkg.dev/$PROJECT_ID/dd-planner/dd-planner:$SHORT_SHA"
      - "-t"
      - "australia-southeast1-docker.pkg.dev/$PROJECT_ID/dd-planner/dd-planner:latest"
      - "--build-arg"
      - "REACT_APP_BACKEND_URL="
      - "."

  # Step 2: Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "australia-southeast1-docker.pkg.dev/$PROJECT_ID/dd-planner/dd-planner"

  # Step 3: Deploy the DEDICATED RENDER SERVICE (ddplan-render) — same image,
  # render-only role, independently scaled. min-instances 0 keeps cost low when
  # idle; it scales up on export bursts without touching the main app.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "ddplan-render"
      - "--image"
      - "australia-southeast1-docker.pkg.dev/$PROJECT_ID/dd-planner/dd-planner:$SHORT_SHA"
      - "--region"
      - "australia-southeast1"
      - "--platform"
      - "managed"
      - "--port"
      - "8080"
      - "--memory"
      - "4Gi"                    # headroom for headless Chromium
      - "--cpu"
      - "4"
      - "--min-instances"
      - "0"                     # scale to zero when no exports — cost efficient
      - "--max-instances"
      - "10"                    # absorb concurrent export bursts here, off the app
      - "--timeout"
      - "300"
      - "--cpu-boost"
      - "--execution-environment"
      - "gen2"
      - "--allow-unauthenticated"   # protected by RENDER_SERVICE_KEY on /api/internal/render/*
      - "--set-env-vars"
      - "DB_NAME=resource_planner,MULTI_TENANT_ENABLED=false,PLATFORM_DB_NAME=platform_db,TENANT_DB_PREFIX=tenant_,PLAYWRIGHT_BROWSERS_PATH=/pw-browsers,EXPORT_RENDER_CONCURRENCY=2"
      - "--update-secrets"
      - "MONGO_URL=MONGO_URL:latest,SECRET_KEY=SECRET_KEY:latest,EMERGENT_LLM_KEY=EMERGENT_LLM_KEY:latest,EXPORT_API_KEY=EXPORT_API_KEY:latest,RENDER_SERVICE_KEY=RENDER_SERVICE_KEY:latest"

  # Step 4: Deploy the MAIN app (ddplan). It delegates renders to ddplan-render
  # when _RENDER_SERVICE_URL is set (otherwise renders in-process).
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "ddplan"
      - "--image"
      - "australia-southeast1-docker.pkg.dev/$PROJECT_ID/dd-planner/dd-planner:$SHORT_SHA"
      - "--region"
      - "australia-southeast1"
      - "--platform"
      - "managed"
      - "--port"
      - "8080"                  # MUST match nginx listen port and EXPOSE in Dockerfile
      - "--memory"
      - "4Gi"                    # Bumped 2Gi->4Gi: headless Chromium report renders were OOM-killing the 2Gi instance, returning instant 502s to all concurrent requests. 4Gi gives Chromium + uvicorn + nginx safe headroom.
      - "--cpu"
      - "4"                      # 2->4 vCPU so a heavy export render doesn't starve concurrent API requests on the same instance
      - "--min-instances"
      - "1"                     # Keep 1 instance warm — prevents cold-start 502 on login
      - "--max-instances"
      - "10"                    # Raised for multi-tenant load — more instances absorb concurrent exports instead of stacking on one
      - "--timeout"
      - "300"
      - "--cpu-boost"           # Give container extra CPU during startup — reduces cold-start time (Cloud Run 2nd-gen feature)
      - "--execution-environment"
      - "gen2"
      - "--allow-unauthenticated"
      - "--set-env-vars"
      - "DB_NAME=resource_planner,MULTI_TENANT_ENABLED=false,PLATFORM_DB_NAME=platform_db,TENANT_DB_PREFIX=tenant_,PLAYWRIGHT_BROWSERS_PATH=/pw-browsers,EXPORT_RENDER_CONCURRENCY=2,RENDER_SERVICE_URL=${_RENDER_SERVICE_URL}"
      - "--update-secrets"
      - "MONGO_URL=MONGO_URL:latest,SECRET_KEY=SECRET_KEY:latest,EMERGENT_LLM_KEY=EMERGENT_LLM_KEY:latest,EXPORT_API_KEY=EXPORT_API_KEY:latest,RENDER_SERVICE_KEY=RENDER_SERVICE_KEY:latest"

images:
  - "australia-southeast1-docker.pkg.dev/$PROJECT_ID/dd-planner/dd-planner:$SHORT_SHA"
  - "australia-southeast1-docker.pkg.dev/$PROJECT_ID/dd-planner/dd-planner:latest"

options:
  logging: CLOUD_LOGGING_ONLY
